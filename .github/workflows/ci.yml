name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm test
      - name: Lint with web-ext
        run: npx web-ext lint --self-hosted
        continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package add-on
        run: bash scripts/package-addon.sh
      - uses: actions/upload-artifact@v4
        with:
          name: thunderbird-openarchiver-xpi
          path: dist/
